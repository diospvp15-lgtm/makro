<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4f4f1" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0d0d0d" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Makro">
  <meta name="description" content="Kalorien, Makros und Gewicht mit adaptivem Verbrauch">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/app.css">
  <title>Makro</title>
</head>
<body>
  <main id="view" class="view"></main>

  <nav id="tabbar" class="tabbar" hidden aria-label="Bereiche">
    <button data-view="heute">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 11.5 12 5l7 6.5V19a1 1 0 0 1-1 1h-4v-5h-4v5H6a1 1 0 0 1-1-1z"/></svg>
      <span>Heute</span>
    </button>
    <button id="addtab" class="tab-add" aria-label="Essen eintragen">
      <span class="tab-add-circle" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></span>
      <span>Eintragen</span>
    </button>
    <button data-view="fortschritt">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19h16M6 15l4-4 3 3 5-6"/></svg>
      <span>Fortschritt</span>
    </button>
  </nav>

  <div id="sheet" class="sheet" hidden role="dialog" aria-modal="true"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
